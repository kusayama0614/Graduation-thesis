services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.11
    volumes:
      - .:/workspace
    working_dir: /workspace
    tty: true
  backend:
    image: mcr.microsoft.com/devcontainers/python:3.11
    volumes:
      - .:/workspace
      - ./backend/venv:/workspace/backend/venv
    working_dir: /workspace/backend
    ports:
      - "5001:5000"
    environment:
      - FLASK_APP=run.py
      - HOST_IP=${HOST_IP}
    command: bash -lc "/workspace/backend/venv/bin/python -m flask run --host=0.0.0.0 --port=5000"