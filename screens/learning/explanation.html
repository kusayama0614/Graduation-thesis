<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解説 - 個別解説</title>
    <link rel="stylesheet" href="learning.css">
    <link rel="icon" href="data:,">
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }, startup: { typeset: false } };
    </script>
    <script src="../vendor/mathjax/tex-svg.js" async></script>
</head>
<body>
    <main>
        <section class="card no-print">
            <div class="card-header">
                <div>
                    <h2 id="metaTitle">解説</h2>
                    <p class="card-lead" id="metaLead"></p>
                </div>
                <div class="button-row" style="margin-top: 0;">
                    <button class="button button-light" onclick="toggleTrace()" id="traceButton">判断と検算の記録を表示</button>
                    <button class="button button-light" onclick="startEdit()" id="editButton">直す</button>
                    <button class="button button-light hidden" onclick="approve()" id="approveButton">確認済みにする</button>
                    <button class="button" onclick="window.print()">印刷する</button>
                </div>
            </div>
            <div id="statusNotice"></div>
        </section>

        <section class="card">
            <div class="explanation-body" id="content"><p class="empty">読み込み中…</p></div>
        </section>

        <section class="card no-print hidden" id="editCard">
            <h2>解説を直す</h2>
            <p class="card-lead">Markdown（# 見出し，- 箇条書き，**太字**）と $数式$ で書けます。保存すると確認済みになり，同じ解説を使い回した生徒にも反映されます（生徒ごとに直した解説は上書きしません）。生成された元の文は記録に残ります。</p>
            <textarea id="editText" rows="18" oninput="previewEdit()"></textarea>
            <label class="checkbox" style="margin-top: 8px;"><input type="checkbox" id="applyGroup" checked> 同じ解説を使い回した生徒にも反映する</label>
            <div class="button-row">
                <button class="button" onclick="saveEdit()">保存して確認済みにする</button>
                <button class="button button-light" onclick="cancelEdit()">やめる</button>
            </div>
        </section>

        <section class="card no-print hidden" id="traceCard">
            <h2>判断と検算の記録</h2>
            <p class="card-lead">各ステップに何を含めたか（Chain 2）と，計算・式の変形の検算結果（Chain 4）です。</p>
            <div id="trace"></div>
        </section>
    </main>

    <script src="../common/api-debug-badge.js"></script>
    <script src="learning-common.js"></script>
    <script>
        const L = window.Learning;
        const KIND_LABELS = { individual: '積み上げ型（個別化）', master: 'マスター解説', subtractive: '引き算型（比較用）' };
        const STATUS_LABELS = { ok: 'OK', ng: '誤り', definition: '定義', unverifiable: '検算不能', condition: '新しい条件' };

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await L.initPage('problems', '解説の表示', '生徒に配布する解説（印刷すると本文だけが出力されます）');
                const id = L.queryParam('id');
                if (!id) {
                    throw new Error('解説が指定されていません');
                }
                const payload = await L.api('GET', `/learning/explanations/${encodeURIComponent(id)}`);
                render(payload.explanation);
                if (L.queryParam('edit') === '1' && payload.explanation.status !== 'ok' && !payload.explanation.reviewed) {
                    toggleTrace();
                }
            } catch (error) {
                document.getElementById('content').innerHTML = `<div class="notice notice-error">${L.escapeHtml(error.message)}</div>`;
            }
        });

        let current = null;

        function render(e) {
            current = e;
            document.title = `${e.student_id ? `${e.student_id} ` : ''}解説 - 個別解説`;
            document.getElementById('metaTitle').textContent =
                `${KIND_LABELS[e.kind] || e.kind}${e.student_id ? `：生徒 ${e.student_id}` : ''}`;
            document.getElementById('metaLead').textContent = `生成 ${L.formatDateTime(e.created_at)}　／　モデル ${e.model_name || '—'}`;
            const warnings = (e.trace && e.trace.warnings) || [];
            document.getElementById('statusNotice').innerHTML = e.status === 'ok'
                ? `<div class="notice notice-ok">すべてのステップで，抜き出した計算と式の変形の検算が通っています。${warnings.length ? `（注意 ${warnings.length} 件は下の記録を確認してください）` : ''}</div>`
                : e.reviewed
                    ? '<div class="notice notice-ok">検算で直らなかったステップがありましたが，教員が確認済みです。</div>'
                    : `<div class="notice notice-error">検算で直らなかったステップがあります（要確認）。下の「判断と検算の記録」で該当箇所を確認し，必要なら「直す」で修正してから「確認済みにする」を押してください。</div>`;
            document.getElementById('statusNotice').innerHTML +=
                (e.reviewed && e.status === 'ok' ? '<div class="notice notice-ok">教員が確認済みです。</div>' : '')
                + (e.edited ? '<div class="notice">教員が直した解説です（生成された元の文は「判断と検算の記録」の末尾にあります）。</div>' : '')
                + (e.reused_from ? `<div class="notice">判断が同じ生徒の解説を使い回しています（<a href="explanation.html?id=${encodeURIComponent(e.reused_from)}">元の解説</a>）。判断の理由はこの生徒自身の定着度によるものです。</div>` : '');
            document.getElementById('approveButton').classList.toggle('hidden', e.status === 'ok' || e.reviewed);
            const content = document.getElementById('content');
            content.innerHTML = L.renderMarkdown(e.content);
            L.typesetMath(content);
            renderTrace(e.trace || {});
            if (e.original_content) {
                document.getElementById('trace').innerHTML += `<div class="step-trace"><h4>生成された元の文（教員が直す前）</h4>
                    <div class="explanation-body">${L.renderMarkdown(e.original_content)}</div></div>`;
            }
        }

        function startEdit() {
            document.getElementById('editText').value = current ? current.content || '' : '';
            document.getElementById('editCard').classList.remove('hidden');
            document.getElementById('editCard').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById('editCard').classList.add('hidden');
            render(current);
        }

        let previewTimer = null;
        function previewEdit() {
            clearTimeout(previewTimer);
            previewTimer = setTimeout(() => {
                const content = document.getElementById('content');
                content.innerHTML = L.renderMarkdown(document.getElementById('editText').value);
                L.typesetMath(content);
            }, 400);
        }

        async function review(body) {
            try {
                const payload = await L.api('PUT', `/learning/explanations/${encodeURIComponent(current.id)}`, {
                    ...body, apply_to_group: document.getElementById('applyGroup').checked,
                });
                document.getElementById('editCard').classList.add('hidden');
                render(payload.explanation);
                L.toast(`確認済みにしました（${payload.updated} 人分）`, 'ok');
            } catch (error) {
                L.toast(error.message, 'error');
            }
        }

        function saveEdit() {
            review({ content: document.getElementById('editText').value });
        }

        function approve() {
            review({});
        }

        function claimRow(c) {
            return `<tr><td><span class="badge badge-${c.status}">${STATUS_LABELS[c.status] || c.status}</span></td>
                <td>${L.escapeHtml(c.lhs_text || c.lhs)} = ${L.escapeHtml(c.rhs_text || c.rhs)}</td>
                <td class="muted">${L.escapeHtml(c.status === 'ng' && c.true_value ? `正しくは ${c.true_value}` : (c.detail || ''))}</td></tr>`;
        }

        function relationRow(r) {
            const detail = r.status === 'ng'
                ? `${r.previous_expr} の解 ${r.previous_solution} ／ この式の解 ${r.current_solution}`
                : (r.detail || '');
            return `<tr><td><span class="badge badge-${r.status}">${STATUS_LABELS[r.status] || r.status}</span></td>
                <td>${L.escapeHtml(r.text || r.expr)}</td><td class="muted">${L.escapeHtml(detail)}</td></tr>`;
        }

        function renderTrace(trace) {
            const steps = trace.steps || [];
            document.getElementById('trace').innerHTML = (trace.warnings || []).map((w) =>
                `<div class="notice notice-warn">${L.escapeHtml(w)}</div>`).join('') + steps.map((step) => {
                const decision = step.decision || {};
                const attempts = (step.attempts || []).map((a) => {
                    const claims = (a.claims || []).map(claimRow).join('');
                    const relations = (a.relations || []).map(relationRow).join('');
                    const final = a.final_check
                        ? `<div>結論の照合：${L.escapeHtml(a.final_check.final_answer || '（抜き出せず）')} → ${a.final_check.is_correct === true ? '一致' : a.final_check.is_correct === false ? `不一致（正しい答え ${L.escapeHtml(a.final_check.correct_answer)}）` : '判定できず'}</div>`
                        : '';
                    return `<div class="attempt">
                        <strong>${a.attempt} 回目の生成：</strong>${a.ok ? '<span class="badge badge-ok">検算OK</span>' : '<span class="badge badge-ng">差し戻し</span>'}
                        ${claims || relations ? `<div class="table-wrap"><table><tbody>${claims}${relations}</tbody></table></div>` : '<div class="muted">抜き出された計算・式の変形はありません</div>'}
                        ${final}
                        ${a.feedback ? `<div class="notice notice-warn">差し戻し：${L.escapeHtml(a.feedback)}</div>` : ''}
                    </div>`;
                }).join('');
                return `<div class="step-trace">
                    <h4>ステップ ${step.step_id}：${L.escapeHtml(step.title)}
                        <span class="badge badge-${step.status}">${step.status === 'ok' ? '検算済み' : '要確認'}</span></h4>
                    <div>${(decision.elements || []).map((e) => `<span class="badge badge-element">${L.escapeHtml(L.ELEMENT_LABELS[e] || e)}</span>`).join('')}</div>
                    <ul class="reasons">${(decision.reasons || []).map((r) => `<li>${L.escapeHtml(r)}</li>`).join('')}</ul>
                    ${attempts}
                </div>`;
            }).join('');
        }

        function toggleTrace() {
            const card = document.getElementById('traceCard');
            card.classList.toggle('hidden');
            document.getElementById('traceButton').textContent =
                card.classList.contains('hidden') ? '判断と検算の記録を表示' : '判断と検算の記録を隠す';
            if (!card.classList.contains('hidden')) {
                card.scrollIntoView({ behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
