<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - 教師管理システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        .login-header p {
            font-size: 14px;
            color: #666;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.2);
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 10px;
            background: #ffebee;
            border-radius: 5px;
            border-left: 4px solid #d32f2f;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>教師管理システム</h1>
            <p>ログイン</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="teacherId">教師ID</label>
                <input 
                    type="text" 
                    id="teacherId" 
                    name="teacherId" 
                    placeholder="教師IDを入力してください" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="パスワードを入力してください" 
                    required
                >
            </div>

            <button type="submit" class="login-button">ログイン</button>
        </form>

        <div class="login-footer">
            <p>© 2026 教師管理システム</p>
        </div>
    </div>

    <script>
        // ログインフォームの処理
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const teacherId = document.getElementById('teacherId').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            // バリデーション
            if (!teacherId || !password) {
                showError('教師IDとパスワードを入力してください');
                return;
            }

            if (teacherId.length < 3) {
                showError('教師IDは3文字以上である必要があります');
                return;
            }

            if (password.length < 6) {
                showError('パスワードは6文字以上である必要があります');
                return;
            }

            // デモ用のログイン処理
            // 本来はサーバー側で認証を行う必要があります
            if (teacherId === 'teacher001' && password === 'password123') {
                showSuccess('ログインに成功しました！');
                // ログイン情報をローカルストレージに保存
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('teacherId', teacherId);
                
                // ホーム画面にリダイレクト
                setTimeout(function() {
                    window.location.href = 'home.html';
                }, 1500);
            } else {
                showError('教師IDまたはパスワードが正しくありません');
            }
        });

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(function() {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        function showSuccess(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.style.backgroundColor = '#e8f5e9';
            errorMessage.style.color = '#2e7d32';
            errorMessage.style.borderLeftColor = '#2e7d32';
            errorMessage.classList.add('show');
        }
    </script>
</body>
</html>
