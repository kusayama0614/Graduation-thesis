<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - 教師管理システム</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>教師管理システム</h1>
            <p>ログイン</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="teacherId">教師ID</label>
                <input 
                    type="text" 
                    id="teacherId" 
                    name="teacherId" 
                    placeholder="教師IDを入力してください" 
                    value="t01"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="パスワードを入力してください" 
                    value="1234"
                    required
                >
            </div>

            <button type="submit" class="login-button">ログイン</button>
        </form>

        <div class="login-footer">
            <p>© 2026 教師管理システム</p>
        </div>
    </div>

    <script>
        // ログインフォームの処理
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const teacherId = document.getElementById('teacherId').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            // バリデーション
            if (!teacherId || !password) {
                showError('教師IDとパスワードを入力してください');
                return;
            }

            if (teacherId.length < 3) {
                showError('教師IDは3文字以上である必要があります');
                return;
            }

            if (password.length < 4) {
                showError('パスワードは4文字以上である必要があります');
                return;
            }

            // デモ用のログイン処理
            // 本来はサーバー側で認証を行う必要があります
            if (teacherId === 't01' && password === '1234') {
                showSuccess('ログインに成功しました！');
                // ログイン情報をローカルストレージに保存
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('teacherId', teacherId);
                
                // ホーム画面にリダイレクト（正しい相対パス）
                setTimeout(function() {
                    window.location.href = '../home/home.html';
                }, 1500);
            } else {
                showError('教師IDまたはパスワードが正しくありません');
            }
        });

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(function() {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        function showSuccess(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.style.backgroundColor = '#e8f5e9';
            errorMessage.style.color = '#2e7d32';
            errorMessage.style.borderLeftColor = '#2e7d32';
            errorMessage.classList.add('show');
        }
    </script>
</body>
</html>
