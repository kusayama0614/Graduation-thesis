<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - 教師管理システム</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>教師管理システム</h1>
            <p>ログイン</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="teacherId">教師ID</label>
                <input 
                    type="text" 
                    id="teacherId" 
                    name="teacherId" 
                    placeholder="教師IDを入力してください" 
                    value="teacher001"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="パスワードを入力してください" 
                    value="password123"
                    required
                >
            </div>

            <button type="submit" class="login-button">ログイン</button>
        </form>

        <div class="login-footer">
            <p>© 2026 教師管理システム</p>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api';

        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const response = await fetch(`${API_BASE_URL}/auth/session`, {
                    credentials: 'include'
                });
                const result = await response.json();

                if (result.authenticated) {
                    window.location.href = '../home/home.html';
                }
            } catch (error) {
                console.warn('Session check failed:', error);
            }
        });

        // ログインフォームの処理
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const teacherId = document.getElementById('teacherId').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            // バリデーション
            if (!teacherId || !password) {
                showError('教師IDとパスワードを入力してください');
                return;
            }

            if (teacherId.length < 3) {
                showError('教師IDは3文字以上である必要があります');
                return;
            }

            if (password.length < 4) {
                showError('パスワードは4文字以上である必要があります');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        teacher_id: teacherId,
                        password: password
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    showError(result.error || '教師IDまたはパスワードが正しくありません');
                    return;
                }

                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('teacherId', result.teacher_id || teacherId);
                showSuccess('ログインに成功しました！');

                setTimeout(function() {
                    window.location.href = '../home/home.html';
                }, 1000);
            } catch (error) {
                showError('ログイン処理に失敗しました');
            }
        });

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(function() {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        function showSuccess(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.style.backgroundColor = '#e8f5e9';
            errorMessage.style.color = '#2e7d32';
            errorMessage.style.borderLeftColor = '#2e7d32';
            errorMessage.classList.add('show');
        }
    </script>
</body>
</html>
