<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解答用紙アップロード - 教師管理システム</title>
        // Preview/読み取り機能は削除されました。選択したファイルはそのままアップロード時に送信されます。

                <div class="form-group">
                    <label for="examDate">試験日</label>
                    <input type="date" id="examDate" required>
                </div>

                <div class="form-group">
                    <label for="notes">備考</label>
                    <textarea id="notes" placeholder="特記事項や注意点があれば入力してください..."></textarea>
                </div>
            </div>

            <!-- セクション4: 処理オプション -->
            <div class="section">
                <h2>処理オプション</h2>
                <p>アップロード後に実行する処理を選択してください。</p>

                <div class="form-group" style="display: flex; flex-direction: column; gap: 12px;">
                    <label style="display: flex; align-items: center; gap: 10px; font-weight: 600;">
                        <input type="checkbox" id="autoScore" checked>
                        自動採点を実行する
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; font-weight: 600;">
                        <input type="checkbox" id="ocrProcess" checked>
                        OCRで文字認識を行う
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; font-weight: 600;">
                        <input type="checkbox" id="generateReport">
                        分析レポートを生成する
                    </label>
                </div>

                <div class="alert alert-info show" style="margin-top: 16px;">
                    <strong>処理の流れ:</strong> アップロード後に OCR → 自動採点 → 必要に応じてレポート生成、という順で進みます。
                </div>
            </div>

            <!-- セクション5: 処理進捗 -->
            <div class="section" id="processingSection" style="display: none;">
                <h2>処理進捗</h2>
                <div class="processing-summary" id="processingSummary">アップロード待ちです</div>
                <div class="progress-bar">
                    <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
                </div>
                <div class="processing-steps" id="processingSteps"></div>
            </div>

            <!-- ボタン -->
            <div class="button-group">
                <button class="button button-secondary" onclick="goHome()">キャンセル</button>
                <button class="button button-primary" onclick="submitData()">アップロードして処理する</button>
            </div>
        </div>
    </div>

    <script src="../common/api-debug-badge.js"></script>
    <script>
        function resolveApiBaseUrl() {
            const stored = localStorage.getItem('apiBaseUrl');
            if (stored) {
                return stored.replace(/\/$/, '');
            }

            if (window.location.protocol === 'file:') {
                return 'http://127.0.0.1:5001/api';
            }

            if (window.location.port === '5001') {
                return '/api';
            }

            return `${window.location.protocol}//${window.location.hostname}:5001/api`;
        }

        const API_BASE_URL = resolveApiBaseUrl();
        let selectedFiles = [];
        let answerKeyFile = null;
        let answerKeyCandidates = [];
        let processingPollTimer = null;
        let processingRecordId = null;
        let processingWorkflow = null;

        function mountApiDebugBadge() {
            if (window.ApiDebugBadge && typeof window.ApiDebugBadge.init === 'function') {
                window.ApiDebugBadge.init(API_BASE_URL);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', mountApiDebugBadge);
        } else {
            mountApiDebugBadge();
        }

        // ファイル入力の変更
        document.getElementById('fileInput').addEventListener('change', function(e) {
            handleFiles(e.target.files);
        });

        document.getElementById('answerKeyInput').addEventListener('change', function(e) {
            answerKeyFile = e.target.files?.[0] || null;
            const hint = document.getElementById('answerKeyHint');
            if (answerKeyFile) {
                hint.className = 'alert info show';
                hint.innerHTML = `<strong>選択済み:</strong> ${escapeHtml(answerKeyFile.name)}。プレビュー機能は無効化されています。アップロード時にサーバ側で解析されます。`;
            } else {
                hint.className = 'alert';
                hint.textContent = '';
            }
        });

        async function loadOcrStatus() {
            const banner = document.getElementById('ocrStatusBanner');
            try {
                const response = await fetch(`${API_BASE_URL}/upload/ocr-status`, {
                    credentials: 'include'
                });
                const status = await response.json();

                if (!response.ok) {
                    throw new Error(status.error || 'OCR status request failed');
                }

                const items = [
                    `Google Vision: ${status.vision_configured ? '設定あり' : '未設定'}`,
                    `Tesseract: ${status.tesseract_available ? '利用可' : '未インストール'}`,
                    `PDF本文抽出: ${status.pdf_text_extraction_available ? '利用可' : '利用不可'}`,
                ];

                banner.className = 'alert alert-info show';
                banner.innerHTML = `
                    <strong>OCR状態:</strong><br>
                    ${items.map((item) => `・${item}`).join('<br>')}
                    ${status.vision_error ? `<br><small>Vision確認メモ: ${escapeHtml(status.vision_error)}</small>` : ''}
                    <br><small>※ スキャン画像PDFの実OCRは「模範解答を読み取りする」プレビューで確認してください。</small>
                `;
            } catch (error) {
                banner.className = 'alert alert-warning show';
                banner.textContent = 'OCRの状態を取得できませんでした。PDF本文抽出のみ動作する場合があります。';
            }
        }

        // ドラッグ&ドロップ
        const uploadArea = document.getElementById('uploadArea');

        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', function() {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        // ファイルハンドリング
        function handleFiles(files) {
            selectedFiles = Array.from(files);
            updateFileList();
        }

        // ファイルリストを更新
        function updateFileList() {
            const fileList = document.getElementById('fileList');
            const fileItems = document.getElementById('fileItems');

            if (selectedFiles.length === 0) {
                fileList.style.display = 'none';
                return;
            }

            fileList.style.display = 'block';
            fileItems.innerHTML = '';

            selectedFiles.forEach((file, index) => {
                const fileSize = (file.size / 1024 / 1024).toFixed(2);
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <div class="file-item-info">
                        <div class="file-item-name">📄 ${file.name}</div>
                        <div class="file-item-size">${fileSize} MB</div>
                    </div>
                    <button class="file-item-remove" onclick="removeFile(${index})">削除</button>
                `;
                fileItems.appendChild(fileItem);
            });
        }

        // ファイルを削除
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        // Preview/preview-edit functions removed: answer key files are uploaded directly without client-side preview.

        // データを送信
        async function submitData() {
            if (selectedFiles.length === 0) {
                showAlert('ファイルを選択してください', 'error');
                return;
            }

            const studentGrade = document.getElementById('studentGrade').value;
            const studentClass = document.getElementById('studentClass').value;
            const studentId = document.getElementById('studentId').value.trim();
            const testName = document.getElementById('testName').value.trim();
            const examDate = document.getElementById('examDate').value;

            if (processingPollTimer) {
                clearInterval(processingPollTimer);
                processingPollTimer = null;
            }

            if (!studentGrade) {
                showAlert('学年を選択してください', 'error');
                return;
            }

            if (!studentClass) {
                showAlert('クラスを選択してください', 'error');
                return;
            }

            if (!studentId) {
                showAlert('生徒IDを入力してください', 'error');
                return;
            }

            if (!testName) {
                showAlert('テスト名を入力してください', 'error');
                return;
            }

            if (!examDate) {
                showAlert('試験日を選択してください', 'error');
                return;
            }

            const formData = new FormData();
            selectedFiles.forEach((file) => {
                formData.append('files', file);
            });
            formData.append('teacher_id', localStorage.getItem('teacherId') || 'guest');
            formData.append('student_grade', studentGrade);
            formData.append('student_class', studentClass);
            formData.append('student_id', studentId);
            formData.append('test_name', testName);
            formData.append('subject', 'math');
            formData.append('exam_date', examDate);
            formData.append('notes', document.getElementById('notes').value);
            formData.append('auto_score', document.getElementById('autoScore').checked ? 'true' : 'false');
            formData.append('ocr_process', document.getElementById('ocrProcess').checked ? 'true' : 'false');
            formData.append('generate_report', document.getElementById('generateReport').checked ? 'true' : 'false');
            // Client-side preview removed: only allow server-side parsing of uploaded answer key files.
            if (document.getElementById('autoScore').checked && !answerKeyFile) {
                showAlert('自動採点を使う場合は、解答データ（CSV/XLSX/JSON）または answer_key を指定してください', 'error');
                return;
            }

            if (answerKeyFile) {
                formData.append('answer_key_file', answerKeyFile);
            }

            try {
                const response = await fetch(`${API_BASE_URL}/upload/answer-sheet`, {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'アップロードに失敗しました');
                }

                processingRecordId = result.results?.[0]?.record_id || null;
                processingWorkflow = result.workflow || {};
                const nextSteps = (processingWorkflow.processing_steps || []).join(' → ');
                showProcessingPanel(processingWorkflow, result.results?.[0] || {});
                showAlert(`✓ ${result.message}${nextSteps ? ` / 処理: ${nextSteps}` : ''}`, 'success');

                if (processingRecordId) {
                    startPollingProcessingStatus(processingRecordId);
                }
            } catch (error) {
                showAlert(error.message || 'アップロードに失敗しました', 'error');
            }
        }

        function showProcessingPanel(workflow, uploadResult) {
            const section = document.getElementById('processingSection');
            section.style.display = 'block';

            const steps = buildProcessingSteps(workflow);
            renderProcessingSteps(steps, 'queued', 0, uploadResult.processing_message || 'キューに登録されました');
        }

        function buildProcessingSteps(workflow) {
            const selected = workflow?.processing_steps || [];
            const labels = {
                ocr: 'OCR処理',
                auto_score: '自動採点',
                generate_report: 'レポート生成',
            };

            return [
                { key: 'queued', label: 'キュー登録' },
                ...selected.map((step) => ({ key: step, label: labels[step] || step })),
                { key: 'completed', label: '完了' },
            ];
        }

        function renderProcessingSteps(steps, currentStage, progressPercent, summaryText) {
            const summary = document.getElementById('processingSummary');
            const progressBarFill = document.getElementById('progressBarFill');
            const processingSteps = document.getElementById('processingSteps');

            summary.textContent = summaryText || '処理中です';
            progressBarFill.style.width = `${Math.min(Math.max(progressPercent || 0, 0), 100)}%`;
            processingSteps.innerHTML = '';

            const stageIndex = steps.findIndex((step) => step.key === currentStage);

            steps.forEach((step, index) => {
                const state = index < stageIndex ? 'done' : index === stageIndex ? 'active' : 'pending';
                const item = document.createElement('div');
                item.className = `processing-step ${state}`;
                item.innerHTML = `
                    <div class="processing-step-icon">${state === 'done' ? '✓' : index + 1}</div>
                    <div class="processing-step-label">${step.label}</div>
                `;
                processingSteps.appendChild(item);
            });
        }

        function startPollingProcessingStatus(recordId) {
            const steps = buildProcessingSteps(processingWorkflow || {});

            processingPollTimer = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}/analysis/answer-data/${recordId}`, {
                        credentials: 'include'
                    });
                    const detail = await response.json();

                    if (!response.ok) {
                        throw new Error(detail.error || '処理状況の取得に失敗しました');
                    }

                    const progressPercent = detail.progress_percent ?? (detail.status === 'completed' ? 100 : detail.status === 'failed' ? 100 : 10);
                    const currentStage = detail.current_step || (detail.status === 'completed' ? 'completed' : 'queued');
                    const summaryText = detail.processing_message || (detail.status === 'completed' ? 'すべての処理が完了しました' : '処理を進めています');

                    renderProcessingSteps(steps, currentStage, progressPercent, summaryText);

                    if (detail.status === 'completed') {
                        clearInterval(processingPollTimer);
                        processingPollTimer = null;
                        showAlert('✓ すべての処理が完了しました。ホームへ戻ります。', 'success');
                        setTimeout(() => {
                            goHome();
                        }, 1800);
                    }

                    if (detail.status === 'failed') {
                        clearInterval(processingPollTimer);
                        processingPollTimer = null;
                        showAlert(detail.processing_message || '処理に失敗しました', 'error');
                    }
                } catch (error) {
                    clearInterval(processingPollTimer);
                    processingPollTimer = null;
                    showAlert(error.message || '処理状況の取得に失敗しました', 'error');
                }
            }, 1000);
        }

        // ホームに戻る
        function goHome() {
            window.location.href = '../home/home.html';
        }

        // メッセージを表示
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert ${type} show`;
            alertDiv.innerHTML = message;
            
            const content = document.querySelector('.content');
            content.insertBefore(alertDiv, content.firstChild);

            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }

        // ページ読み込み時の処理
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const response = await fetch(`${API_BASE_URL}/auth/session`, {
                    credentials: 'include'
                });
                const result = await response.json();

                if (!result.authenticated) {
                    window.location.href = '../login/login.html';
                    return;
                }
            } catch (error) {
                window.location.href = '../login/login.html';
                return;
            }

            // 今日の日付をデフォルトに設定
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('examDate').value = today;

            renderProcessingSteps(
                [
                    { key: 'queued', label: 'キュー登録' },
                    { key: 'ocr', label: 'OCR処理' },
                    { key: 'auto_score', label: '自動採点' },
                    { key: 'generate_report', label: 'レポート生成' },
                    { key: 'completed', label: '完了' },
                ],
                'queued',
                0,
                'アップロード待ちです'
            );

            await loadOcrStatus();
        });

        function escapeHtml(text) {
            return String(text)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }
    </script>
</body>
</html>
