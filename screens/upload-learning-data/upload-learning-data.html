<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習データアップロード - 教師管理システム</title>
    <link rel="stylesheet" href="upload-learning-data.css">
</head>
<body>
    <div class="container">
        <!-- ヘッダー -->
        <div class="header">
            <h1>📊 学習データアップロード</h1>
            <button class="back-button" onclick="goHome()">← ホームに戻る</button>
        </div>

        <!-- コンテンツ -->
        <div class="content">
            <!-- パンくず -->
            <div class="breadcrumb">
                <span onclick="goHome()" style="cursor: pointer; color: #667eea;">ホーム</span> 
                &gt; 学習データアップロード
            </div>

            <!-- セクション1: 生徒情報 -->
            <div class="section">
                <h2>生徒情報</h2>
                <p>学習データに対応する生徒を特定してください。</p>

                <div class="form-group">
                    <label for="studentGrade">学年 <span style="color: #d32f2f;">*</span></label>
                    <select id="studentGrade" required>
                        <option value="">選択してください</option>
                        <option value="1">1年生</option>
                        <option value="2">2年生</option>
                        <option value="3">3年生</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="studentClass">クラス <span style="color: #d32f2f;">*</span></label>
                    <select id="studentClass" required>
                        <option value="">選択してください</option>
                        <option value="A">A組</option>
                        <option value="B">B組</option>
                        <option value="C">C組</option>
                        <option value="D">D組</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="studentId">生徒ID <span style="color: #d32f2f;">*</span></label>
                    <input type="text" id="studentId" placeholder="例: S001" required>
                </div>
            </div>

            <!-- セクション2: ファイルの選択 -->
            <div class="section">
                <h2>ファイルの選択</h2>
                <p>下記のエリアにファイルをドラッグ&ドロップするか、クリックしてファイルを選択してください。</p>

                <!-- ドラッグ&ドロップエリア -->
                <div class="upload-area" id="uploadArea">
                    <div class="upload-area-icon">📁</div>
                    <h3>ファイルをドラッグ&ドロップ</h3>
                    <p>または以下をクリック</p>
                    <button class="file-select-button" onclick="document.getElementById('fileInput').click()">
                        ファイルを選択する
                    </button>
                    <input type="file" id="fileInput" class="file-input" multiple accept=".pdf,.csv,.xlsx,.xls">
                </div>

                <!-- サポートされるフォーマット -->
                <div class="supported-formats">
                    <h4>📋 サポートされるファイル形式</h4>
                    <ul>
                        <li>PDF (.pdf) - PDF文書</li>
                        <li>CSV (.csv) - カンマ区切り値</li>
                        <li>Excel (.xlsx, .xls) - Excelスプレッドシート</li>
                    </ul>
                </div>

                <!-- ファイルリスト -->
                <div class="file-list" id="fileList" style="display: none;">
                    <h3>📂 選択されたファイル</h3>
                    <div id="fileItems"></div>
                </div>
            </div>

            <!-- セクション3: メタデータ -->
            <div class="section">
                <h2>データの説明</h2>

                <div class="form-group">
                    <label for="dataTitle">データタイトル</label>
                    <input type="text" id="dataTitle" placeholder="例: 2026年5月 中間テスト成績" required>
                </div>

                <div class="form-group">
                    <label for="dataCategory">カテゴリー</label>
                    <select id="dataCategory" required>
                        <option value="">選択してください</option>
                        <option value="mock_exam">模試成績</option>
                        <option value="regular_test">定期テスト結果</option>
                        <option value="small_test">小テスト結果</option>
                        <option value="assignment">課題提出</option>
                        <option value="attendance">出席状況</option>
                        <option value="other">その他</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dataDescription">説明（オプション）</label>
                    <textarea id="dataDescription" placeholder="このデータについて説明を入力してください..."></textarea>
                </div>
            </div>

            <!-- ボタン -->
            <div class="button-group">
                <button class="button button-secondary" onclick="goHome()">キャンセル</button>
                <button class="button button-primary" onclick="submitData()">アップロードする</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api';
        let selectedFiles = [];

        // ファイル入力の変更
        document.getElementById('fileInput').addEventListener('change', function(e) {
            handleFiles(e.target.files);
        });

        // ドラッグ&ドロップ
        const uploadArea = document.getElementById('uploadArea');

        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', function() {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        // ファイルハンドリング
        function handleFiles(files) {
            selectedFiles = Array.from(files);
            updateFileList();
        }

        // ファイルリストを更新
        function updateFileList() {
            const fileList = document.getElementById('fileList');
            const fileItems = document.getElementById('fileItems');

            if (selectedFiles.length === 0) {
                fileList.style.display = 'none';
                return;
            }

            fileList.style.display = 'block';
            fileItems.innerHTML = '';

            selectedFiles.forEach((file, index) => {
                const fileSize = (file.size / 1024 / 1024).toFixed(2);
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <div class="file-item-info">
                        <div class="file-item-name">📄 ${file.name}</div>
                        <div class="file-item-size">${fileSize} MB</div>
                    </div>
                    <button class="file-item-remove" onclick="removeFile(${index})">削除</button>
                `;
                fileItems.appendChild(fileItem);
            });
        }

        // ファイルを削除
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        // データを送信
        async function submitData() {
            if (selectedFiles.length === 0) {
                showAlert('ファイルを選択してください', 'error');
                return;
            }

            const studentGrade = document.getElementById('studentGrade').value;
            const studentClass = document.getElementById('studentClass').value;
            const studentId = document.getElementById('studentId').value.trim();
            const dataTitle = document.getElementById('dataTitle').value.trim();
            const dataCategory = document.getElementById('dataCategory').value;

            if (!studentGrade) {
                showAlert('学年を選択してください', 'error');
                return;
            }

            if (!studentClass) {
                showAlert('クラスを選択してください', 'error');
                return;
            }

            if (!studentId) {
                showAlert('生徒IDを入力してください', 'error');
                return;
            }

            if (!dataTitle) {
                showAlert('データタイトルを入力してください', 'error');
                return;
            }

            if (!dataCategory) {
                showAlert('カテゴリーを選択してください', 'error');
                return;
            }

            const formData = new FormData();
            selectedFiles.forEach((file) => {
                formData.append('files', file);
            });
            formData.append('teacher_id', localStorage.getItem('teacherId') || 'guest');
            formData.append('student_grade', studentGrade);
            formData.append('student_class', studentClass);
            formData.append('student_id', studentId);
            formData.append('title', dataTitle);
            formData.append('category', dataCategory);
            formData.append('description', document.getElementById('dataDescription').value);

            try {
                const response = await fetch(`${API_BASE_URL}/upload/learning-data`, {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'アップロードに失敗しました');
                }

                showAlert(`✓ ${result.message}`, 'success');

                setTimeout(() => {
                    goHome();
                }, 1500);
            } catch (error) {
                showAlert(error.message || 'アップロードに失敗しました', 'error');
            }
        }

        // ホームに戻る
        function goHome() {
            window.location.href = '../home/home.html';
        }

        // メッセージを表示
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert ${type} show`;
            alertDiv.innerHTML = message;
            
            const content = document.querySelector('.content');
            content.insertBefore(alertDiv, content.firstChild);

            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }

        // ページ読み込み時の処理
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const response = await fetch(`${API_BASE_URL}/auth/session`, {
                    credentials: 'include'
                });
                const result = await response.json();

                if (!result.authenticated) {
                    window.location.href = '../login/login.html';
                }
            } catch (error) {
                window.location.href = '../login/login.html';
            }
        });
    </script>
</body>
</html>
