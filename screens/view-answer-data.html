<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解答データ確認 - 教師管理システム</title>
    <link rel="stylesheet" href="view-answer-data.css">
</head>
<body>
    <div class="container">
        <!-- ヘッダー -->
        <div class="header">
            <h1>✓ 解答データ確認</h1>
            <button class="back-button" onclick="goHome()">← ホームに戻る</button>
        </div>

        <!-- フィルターセクション -->
        <div class="filter-section">
            <h2>🔍 検索・フィルター</h2>
            <div class="filter-group">
                <div class="filter-item">
                    <label>テスト名</label>
                    <input type="text" id="testNameFilter" placeholder="テスト名で検索...">
                </div>
                <div class="filter-item">
                    <label>生徒ID</label>
                    <input type="text" id="studentIdFilter" placeholder="生徒IDで検索...">
                </div>
                <div class="filter-item">
                    <label>期間</label>
                    <input type="date" id="dateFilter">
                </div>
            </div>
            <div class="filter-buttons">
                <button class="filter-btn" onclick="applyFilters()">フィルター適用</button>
                <button class="filter-btn reset-btn" onclick="resetFilters()">リセット</button>
            </div>
        </div>

        <!-- テーブルセクション -->
        <div class="table-section">
            <div class="table-header">
                <h3>📊 解答データ一覧</h3>
                <button class="export-button" onclick="exportData()">📥 データをエクスポート</button>
            </div>
            <div class="table-content">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>テスト名</th>
                            <th>生徒ID</th>
                            <th>スコア</th>
                            <th>アップロード日</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- テーブル行がここに挿入されます -->
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="pagination">
                <!-- ページネーションボタンがここに挿入されます -->
            </div>
        </div>
    </div>

    <!-- 詳細表示モーダル -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>解答データ詳細</span>
                <button class="modal-close" onclick="closeDetailModal()">×</button>
            </div>
            <div class="modal-body" id="detailContent">
                <!-- 詳細情報がここに挿入されます -->
            </div>
        </div>
    </div>

    <script>
        // ダミーデータ
        const dummyData = [
            {
                id: 1,
                testName: '2026年5月 中間テスト',
                subject: '数学',
                studentId: 'S001',
                score: 85,
                status: 'completed',
                uploadDate: '2026-05-24',
                processingTime: '2分30秒',
                questions: 20,
                correctAnswers: 17
            },
            {
                id: 2,
                testName: '2026年5月 中間テスト',
                subject: '英語',
                studentId: 'S002',
                score: 92,
                status: 'completed',
                uploadDate: '2026-05-24',
                processingTime: '1分45秒',
                questions: 25,
                correctAnswers: 23
            },
            {
                id: 3,
                testName: '2026年5月 確認テスト',
                subject: '数学',
                studentId: 'S003',
                score: null,
                status: 'processing',
                uploadDate: '2026-05-24',
                processingTime: '処理中...',
                questions: 20,
                correctAnswers: null
            },
            {
                id: 4,
                testName: '2026年4月 実力テスト',
                subject: '国語',
                studentId: 'S004',
                score: 78,
                status: 'completed',
                uploadDate: '2026-05-23',
                processingTime: '3分15秒',
                questions: 15,
                correctAnswers: 12
            },
            {
                id: 5,
                testName: '2026年5月 中間テスト',
                subject: '理科',
                studentId: 'S005',
                score: null,
                status: 'pending',
                uploadDate: '2026-05-24',
                processingTime: '待機中',
                questions: 18,
                correctAnswers: null
            },
            {
                id: 6,
                testName: '2026年4月 実力テスト',
                subject: '数学',
                studentId: 'S006',
                score: 88,
                status: 'completed',
                uploadDate: '2026-05-22',
                processingTime: '2分10秒',
                questions: 20,
                correctAnswers: 18
            }
        ];

        let currentData = dummyData;
        let currentPage = 1;
        const itemsPerPage = 5;

        // ページ読み込み時
        document.addEventListener('DOMContentLoaded', function() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (!isLoggedIn) {
                window.location.href = 'login.html';
                return;
            }

            loadData();
        });

        // データを読み込む
        function loadData() {
            renderTable();
            renderPagination();
        }

        // テーブルをレンダリング
        function renderTable() {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            if (currentData.length === 0) {
                tableBody.parentElement.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>データがありません</h3>
                        <p>検索条件に一致するデータが見つかりませんでした。</p>
                    </div>
                `;
                return;
            }

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = currentData.slice(start, end);

            pageData.forEach((item, index) => {
                const scoreDisplay = item.score !== null ? `${item.score}%` : '---';
                const rowNum = start + index + 1;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${rowNum}</td>
                    <td>${item.testName}</td>
                    <td>${item.studentId}</td>
                    <td><span class="score-cell">${scoreDisplay}</span></td>
                    <td>${item.uploadDate}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="action-btn" onclick="showDetail(${item.id})">詳細</button>
                            <button class="action-btn" onclick="downloadData(${item.id})">DL</button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // ステータスバッジを取得
        function getStatusBadge(status) {
            const statusMap = {
                'pending': '⏳ 待機中',
                'processing': '⚙️ 処理中',
                'completed': '✅ 完了',
                'failed': '❌ 失敗'
            };
            return `<span class="badge ${status}">${statusMap[status] || '---'}</span>`;
        }

        // 詳細を表示
        function showDetail(id) {
            const item = dummyData.find(d => d.id === id);
            if (!item) return;

            const detailContent = document.getElementById('detailContent');
            const scoreDisplay = item.score !== null ? `${item.score}%` : '未処理';

            detailContent.innerHTML = `
                <div class="detail-row">
                    <div class="detail-label">テスト名:</div>
                    <div class="detail-value">${item.testName}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">生徒ID:</div>
                    <div class="detail-value">${item.studentId}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">スコア:</div>
                    <div class="detail-value">${scoreDisplay}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">正答数:</div>
                    <div class="detail-value">${item.correctAnswers !== null ? item.correctAnswers + '/' + item.questions : '---'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">処理時間:</div>
                    <div class="detail-value">${item.processingTime}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">アップロード日:</div>
                    <div class="detail-value">${item.uploadDate}</div>
                </div>
            `;

            document.getElementById('detailModal').classList.add('show');
        }

        // 詳細モーダルを閉じる
        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('show');
        }

        // データをダウンロード
        function downloadData(id) {
            const item = dummyData.find(d => d.id === id);
            if (!item) return;
            alert(`${item.testName} (${item.studentId}) の解答解説をダウンロードします`);
        }

        // フィルターを適用
        function applyFilters() {
            const testName = document.getElementById('testNameFilter').value.toLowerCase();
            const studentId = document.getElementById('studentIdFilter').value.toLowerCase();

            currentData = dummyData.filter(item => {
                return (testName === '' || item.testName.toLowerCase().includes(testName)) &&
                       (studentId === '' || item.studentId.toLowerCase().includes(studentId));
            });

            currentPage = 1;
            loadData();
        }

        // フィルターをリセット
        function resetFilters() {
            document.getElementById('testNameFilter').value = '';
            document.getElementById('studentIdFilter').value = '';
            currentData = dummyData;
            currentPage = 1;
            loadData();
        }

        // ページネーションをレンダリング
        function renderPagination() {
            const totalPages = Math.ceil(currentData.length / itemsPerPage);
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            for (let i = 1; i <= totalPages; i++) {
                const button = document.createElement('button');
                button.textContent = i;
                if (i === currentPage) button.classList.add('active');
                button.onclick = () => {
                    currentPage = i;
                    renderTable();
                    renderPagination();
                    window.scrollTo(0, 0);
                };
                pagination.appendChild(button);
            }
        }

        // データをエクスポート
        function exportData() {
            alert('データをCSV形式でエクスポートします');
        }

        // ホームに戻る
        function goHome() {
            window.location.href = 'home.html';
        }

        // モーダルの外側クリック時に閉じる
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeDetailModal();
            }
        });
    </script>
</body>
</html>
